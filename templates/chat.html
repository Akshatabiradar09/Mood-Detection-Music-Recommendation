<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Chat - Pop Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#10b981',
                        background: '#f8fafc',
                        card: '#ffffff',
                        border: '#e2e8f0',
                        textMain: '#1e293b',
                        textMuted: '#64748b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Backdrop overlay */
        .chat-popup-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* Centered Pop-up Box */
        .chat-popup-box {
            position: relative;
            z-index: 20;
            width: 92%;
            max-width: 440px;
            height: 620px;
            max-height: 90vh;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: zoomIn 0.25s ease-out;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Header */
        .chat-header {
            padding: 14px 18px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #64748b;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }

        .close-btn:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        /* Target selector */
        .chat-selector {
            padding: 10px 18px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-selector label {
            font-size: 12px;
            color: #64748b;
        }

        .chat-selector select {
            flex: 1;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-bubble-wrapper {
            display: flex;
            max-width: 85%;
        }

        .msg-sent-wrapper {
            align-self: flex-end;
        }

        .msg-received-wrapper {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-sent {
            background: #2563eb;
            color: #ffffff;
            font-weight: 500;
            border-bottom-right-radius: 2px;
        }

        .msg-received {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 2px;
        }

        .msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        /* Emojis */
        .chat-emojis {
            padding: 8px 16px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            overflow-x: auto;
        }

        .chat-emojis span {
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .chat-emojis span:hover {
            transform: scale(1.2);
        }

        /* Input Bar */
        .chat-inputbar {
            padding: 12px 16px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
        }

        .chat-inputbar input {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-inputbar input:focus {
            border-color: #2563eb;
        }

        .chat-inputbar button {
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            width: 44px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .chat-inputbar button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Backdrop Overlay (Click outside to close pop up) -->
    <div class="chat-popup-backdrop" id="chatBackdrop" title="Click outside to close pop-up"></div>

    <!-- Centered Pop-Up Dialog Box -->
    <div class="chat-popup-box">
        
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-title">
                <span class="text-primary"><i class="fas fa-comment-dots text-lg"></i></span>
                <span>Mood Chat Pop-Up</span>
            </div>
            <button class="close-btn" id="closeChatBtn" title="Close Pop-Up">&times;</button>
        </div>

        <!-- Target Selector -->
        <div class="chat-selector">
            <label>Chat with:</label>
            <select id="userSelector" onchange="onTargetChanged(this.value)">
                <option value="Mood Assistant">🤖 Mood Assistant (AI Buddy)</option>
            </select>
        </div>

        <!-- Message List -->
        <div class="chat-messages" id="messagesContainer">
            <div class="msg-bubble-wrapper msg-received-wrapper">
                <div class="msg-bubble msg-received">
                    <div class="font-semibold text-primary text-xs mb-1">🤖 Mood Assistant</div>
                    Hello <b>{{ username }}</b>! I'm your AI Mood Assistant right inside this clean pop-up. Ask for song tips or switch to a registered user from the dropdown above!
                    <div class="msg-time">Now</div>
                </div>
            </div>
        </div>

        <!-- Emoji Quick Bar -->
        <div class="chat-emojis">
            <span onclick="insertEmoji('😊')" title="Happy">😊</span>
            <span onclick="insertEmoji('😎')" title="Cool">😎</span>
            <span onclick="insertEmoji('🎵')" title="Music">🎵</span>
            <span onclick="insertEmoji('🔥')" title="Fire">🔥</span>
            <span onclick="insertEmoji('💖')" title="Love">💖</span>
            <span onclick="insertEmoji('🎉')" title="Party">🎉</span>
            <span onclick="insertEmoji('😢')" title="Sad">😢</span>
            <span onclick="insertEmoji('🤔')" title="Thinking">🤔</span>
        </div>

        <!-- Input Box -->
        <div class="chat-inputbar">
            <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" title="Send Message"><i class="fas fa-paper-plane"></i></button>
        </div>

    </div>

    <script>
        const currentUsername = "{{ username }}";
        let currentTarget = "Mood Assistant";
        let refreshTimer = null;

        const messagesContainer = document.getElementById("messagesContainer");
        const chatInput = document.getElementById("chatInput");
        const userSelector = document.getElementById("userSelector");

        // Close pop-up and return to dashboard
        function closeChatPopup() {
            window.location.href = "{{ url_for('dashboard') }}";
        }

        document.getElementById("closeChatBtn").addEventListener("click", closeChatPopup);
        document.getElementById("chatBackdrop").addEventListener("click", closeChatPopup);
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeChatPopup();
        });

        // Load users for target selector
        async function loadUsers() {
            try {
                const res = await fetch("/users/list");
                if (res.ok) {
                    const users = await res.json();
                    userSelector.innerHTML = `<option value="Mood Assistant" ${currentTarget === 'Mood Assistant' ? 'selected' : ''}>🤖 Mood Assistant (AI Buddy)</option>` + 
                        users.map(u => `<option value="${u}" ${currentTarget === u ? 'selected' : ''}>👤 ${u}</option>`).join("");
                }
            } catch (err) {
                console.error("Error loading users:", err);
            }
        }

        function onTargetChanged(val) {
            currentTarget = val;
            messagesContainer.innerHTML = "";
            if (currentTarget === "Mood Assistant") {
                messagesContainer.innerHTML = `
                    <div class="msg-bubble-wrapper msg-received-wrapper">
                        <div class="msg-bubble msg-received">
                            <div class="font-semibold text-primary text-xs mb-1">🤖 Mood Assistant</div>
                            Switched to <b>Mood Assistant</b>! How can I help brighten your mood today?
                            <div class="msg-time">Now</div>
                        </div>
                    </div>
                `;
            } else {
                fetchMessages();
            }
        }

        async function fetchMessages() {
            if (currentTarget === "Mood Assistant") return;
            try {
                const res = await fetch(`/chat/fetch?user=${encodeURIComponent(currentTarget)}`);
                if (res.ok) {
                    const msgs = await res.json();
                    if (msgs.length === 0) {
                        messagesContainer.innerHTML = `
                            <div class="text-center text-xs text-gray-500 my-8">
                                No messages with <b>${currentTarget}</b> yet. Start the conversation!
                            </div>
                        `;
                        return;
                    }
                    messagesContainer.innerHTML = msgs.map(m => {
                        const isSent = m.sender === currentUsername;
                        return `
                            <div class="msg-bubble-wrapper ${isSent ? 'msg-sent-wrapper' : 'msg-received-wrapper'}">
                                <div class="msg-bubble ${isSent ? 'msg-sent' : 'msg-received'}">
                                    ${!isSent ? `<div class="font-semibold text-primary text-xs mb-1">👤 ${m.sender}</div>` : ''}
                                    ${escapeHtml(m.message)}
                                    <div class="msg-time">${m.timestamp || 'Now'}</div>
                                </div>
                            </div>
                        `;
                    }).join("");
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (err) {
                console.error("Error fetching messages:", err);
            }
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = "";

            if (currentTarget === "Mood Assistant") {
                // Append user message
                messagesContainer.insertAdjacentHTML('beforeend', `
                    <div class="msg-bubble-wrapper msg-sent-wrapper">
                        <div class="msg-bubble msg-sent">
                            ${escapeHtml(text)}
                            <div class="msg-time">Now</div>
                        </div>
                    </div>
                `);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // AI Reply logic
                setTimeout(() => {
                    let reply = "";
                    const lower = text.toLowerCase();
                    if (lower.includes("sad") || lower.includes("cry")) {
                        reply = "I hear you 💙 It is okay to feel down. Try listening to some soothing Acoustic Chill or Melancholy tunes on your dashboard to help relax! 🎶";
                    } else if (lower.includes("happy") || lower.includes("good") || lower.includes("great")) {
                        reply = "That is wonderful! 🎉 Keep up that positive vibe and check out our Upbeat Pop tracks!";
                    } else if (lower.includes("angry") || lower.includes("mad")) {
                        reply = "Take a deep breath! 😌 High-Energy Rock or Grunge can help release that frustration. You've got this! ⚡";
                    } else {
                        reply = `Thanks for chatting, <b>${currentUsername}</b>! Want me to recommend songs or analyze your current mood?`;
                    }

                    messagesContainer.insertAdjacentHTML('beforeend', `
                        <div class="msg-bubble-wrapper msg-received-wrapper">
                            <div class="msg-bubble msg-received">
                                <div class="font-semibold text-primary text-xs mb-1">🤖 Mood Assistant</div>
                                ${reply}
                                <div class="msg-time">Now</div>
                            </div>
                        </div>
                    `);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 400);
            } else {
                // Real user message via API
                try {
                    await fetch("/chat/send", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ recipient: currentTarget, message: text })
                    });
                    fetchMessages();
                } catch (err) {
                    console.error("Error sending message:", err);
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function insertEmoji(emoji) {
            chatInput.value += emoji;
            chatInput.focus();
        }

        // Periodic refresh of messages and users
        function startAutoRefresh() {
            refreshTimer = setInterval(() => {
                fetchMessages();
                loadUsers();
            }, 5000);
        }

        // Init
        loadUsers();
        startAutoRefresh();

        // Enter key to send
        chatInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
        document.getElementById("sendBtn").addEventListener("click", sendMessage);
    </script>
</body>
</html>
