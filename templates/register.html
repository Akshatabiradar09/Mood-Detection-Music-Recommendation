<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Mood Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#10b981',
                        background: '#f8fafc',
                        card: '#ffffff',
                        border: '#e2e8f0',
                        textMain: '#1e293b',
                        textMuted: '#64748b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-background text-textMain min-h-screen flex items-center justify-center p-4">

    <!-- Simple Container -->
    <div class="w-full max-w-md">
        
        <!-- Brand / Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-50 text-primary mb-3">
                <i class="fas fa-wand-magic-sparkles text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-textMain tracking-tight">Create your account</h1>
            <p class="text-sm text-textMuted mt-1">Join to detect emotion and discover music</p>
        </div>

        <!-- Card -->
        <div class="bg-card border border-border rounded-xl p-6 shadow-sm">
            
            {% if error %}
                <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-xs text-center font-medium">
                    {{ error }}
                </div>
            {% endif %}
            
            {% if success %}
                <div class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-secondary text-xs text-center font-medium">
                    {{ success }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-textMain mb-1.5">Username</label>
                    <input type="text" 
                           name="username" 
                           placeholder="Choose a username"
                           required
                           class="w-full px-3.5 py-2.5 bg-white border border-border rounded-lg text-textMain placeholder-textMuted text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-medium text-textMain mb-1.5">Password</label>
                    <input type="password" 
                           name="password" 
                           placeholder="Create a password (at least 6 characters)"
                           required
                           class="w-full px-3.5 py-2.5 bg-white border border-border rounded-lg text-textMain placeholder-textMuted text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-medium text-textMain mb-1.5">Email</label>
                    <input type="email" 
                           name="email" 
                           placeholder="your.email@example.com"
                           required
                           class="w-full px-3.5 py-2.5 bg-white border border-border rounded-lg text-textMain placeholder-textMuted text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-textMain mb-1.5">Gender</label>
                        <select name="gender" 
                                required
                                class="w-full px-3.5 py-2.5 bg-white border border-border rounded-lg text-textMain text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                            <option value="" disabled selected>Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-textMain mb-1.5">Age</label>
                        <input type="number" 
                               name="age" 
                               placeholder="Age"
                               min="13" 
                               max="120" 
                               required
                               class="w-full px-3.5 py-2.5 bg-white border border-border rounded-lg text-textMain placeholder-textMuted text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-2.5 bg-primary hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-colors mt-2 shadow-sm">
                    Create Account
                </button>
            </form>

            <div class="mt-5 pt-4 border-t border-border text-center">
                <p class="text-xs text-textMuted">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="text-primary hover:underline font-medium ml-1">Sign in</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
